
name: Android 15 ARM64 - Emulator Compatibility Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator-test:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20

    steps:
      - name: Preparar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar ferramentas Android
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Instalar SDK e diagnosticar
        shell: bash
        run: |
          set +e
          mkdir -p diagnostics

          yes | sdkmanager --licenses \
            > diagnostics/licenses.txt 2>&1

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "emulator" \
            "system-images;android-35;google_apis;arm64-v8a" \
            > diagnostics/sdk-install.txt 2>&1

          echo "SDK_INSTALL_EXIT=$?" \
            >> diagnostics/sdk-install.txt

          {
            echo "=== Host ==="
            uname -a
            uname -m

            echo
            echo "=== Java ==="
            java -version 2>&1

            echo
            echo "=== Pacotes instalados ==="
            sdkmanager --list_installed 2>&1

            echo
            echo "=== Binario do emulador ==="
            EMULATOR_BIN="$ANDROID_HOME/emulator/emulator"

            if [ -e "$EMULATOR_BIN" ]; then
              file "$EMULATOR_BIN"
              "$EMULATOR_BIN" -version 2>&1
              echo "=== Aceleracao ==="
              "$EMULATOR_BIN" -accel-check 2>&1
            else
              echo "EMULATOR_BINARY_MISSING"
            fi

            echo
            echo "=== KVM ==="
            ls -l /dev/kvm 2>&1
          } > diagnostics/compatibility.txt 2>&1

      - name: Criar e testar Android 15
        shell: bash
        run: |
          set +e
          mkdir -p diagnostics

          echo "no" | avdmanager create avd \
            -n Android15ARM64 \
            -k "system-images;android-35;google_apis;arm64-v8a" \
            -d pixel_2 \
            > diagnostics/avd-create.txt 2>&1

          RESULT=$?
          echo "AVD_CREATE_EXIT=$RESULT" \
            >> diagnostics/avd-create.txt

          if [ "$RESULT" -eq 0 ]; then
            "$ANDROID_HOME/emulator/emulator" \
              -avd Android15ARM64 \
              -no-window \
              -no-audio \
              -no-boot-anim \
              -no-snapshot \
              -gpu swiftshader_indirect \
              -verbose \
              > diagnostics/emulator-boot.txt 2>&1 &

            PID=$!
            BOOT_OK=0

            for i in $(seq 1 180); do
              adb start-server >/dev/null 2>&1

              if adb get-state >/dev/null 2>&1; then
                BOOTED=$(adb shell getprop \
                  sys.boot_completed 2>/dev/null | tr -d '\r')

                if [ "$BOOTED" = "1" ]; then
                  BOOT_OK=1
                  break
                fi
              fi

              if ! kill -0 "$PID" 2>/dev/null; then
                echo "Emulador encerrou antes de iniciar." \
                  >> diagnostics/emulator-boot.txt
                break
              fi

              sleep 1
            done

            {
              echo "ANDROID_BOOT_COMPLETED=$BOOT_OK"
              adb devices -l
              echo "Android release:"
              adb shell getprop ro.build.version.release
              echo "API:"
              adb shell getprop ro.build.version.sdk
              echo "ABI:"
              adb shell getprop ro.product.cpu.abi
            } >> diagnostics/emulator-boot.txt 2>&1

            kill "$PID" 2>/dev/null
            wait "$PID" 2>/dev/null
          else
            echo "Falha ao criar o AVD." \
              > diagnostics/emulator-boot.txt
          fi

          exit 0

      - name: Salvar diagnosticos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android15-emulator-test
          path: diagnostics/
          retention-days: 7
          if-no-files-found: warn
